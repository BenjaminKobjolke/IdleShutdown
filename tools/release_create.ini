; Config for `release-tool create` - run via tools\release_create.bat.
; Only values differing from release-tool defaults are listed.

[Release]
scope = idle-shutdown
publish_platform = Website
english_only = true
; Label = pyproject.toml version; each release bumps its last segment (0.1.0 -> 0.1.1).
versioning = semver

[Bats]
build_increment = tools/version_increment.bat
build_decrement = tools/version_decrement.bat
publish = tools/publish_release.bat

[GitHubRelease]
; Runs after commit/tag/push; needs `gh auth login`.
enabled = true
; Stable-name copy written by tools/build_release.bat.
assets = releases/windows/IdleShutdownSetup.exe
repo = BenjaminKobjolke/IdleShutdown
