[project]
name = "idle-shutdown"
version = "0.1.0"
description = "Shutdown after a set amount of minutes or hours of idle time"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-timeout"]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 120
